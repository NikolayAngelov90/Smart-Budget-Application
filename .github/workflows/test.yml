name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

# The benchmark + preview steps post PR comments (github.rest.issues.createComment),
# which needs write scope. Without this the default read-only token 403s and fails
# the whole Tests job even when type-check/lint/tests/build all pass.
permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check coverage threshold
        run: |
          COVERAGE=$(node -p "
            const coverage = require('./coverage/coverage-summary.json');
            const total = coverage.total;
            Math.min(total.statements.pct, total.branches.pct, total.functions.pct, total.lines.pct);
          ")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 30" | bc -l) )); then
            echo "❌ Coverage ($COVERAGE%) is below 30% threshold"
            exit 1
          fi
          echo "✅ Coverage ($COVERAGE%) meets minimum 30% threshold"

      - name: Check required environment variables
        run: node scripts/check-env-vars.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || 'test-vapid-public' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY || 'test-vapid-private' }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:test@example.com' }}

      - name: Security audit dependencies
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # TEMPORARY PROBE — this build PASSES while the identical commit fails the
      # deploy job's build. Names only, never values. Remove once the difference
      # between the two jobs is settled.
      - name: Build production app for benchmarks
        run: |
          echo "NEXT_PUBLIC_SUPABASE var count: $(env | grep -c NEXT_PUBLIC_SUPABASE || true)"
          echo "build-relevant vars visible to this job:"
          env | grep -oE '^(NEXT_PUBLIC_[A-Z_]+|VAPID_[A-Z_]+|SUPABASE_[A-Z_]+|UPSTASH_[A-Z_]+|BENCHMARK_MODE|CRON_SECRET)' | sort || true
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          UPSTASH_REDIS_REST_URL: https://test.upstash.io
          UPSTASH_REDIS_REST_TOKEN: test-token
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          BENCHMARK_MODE: 'true'

      - name: Start Next.js server in background
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          UPSTASH_REDIS_REST_URL: https://test.upstash.io
          UPSTASH_REDIS_REST_TOKEN: test-token
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          BENCHMARK_MODE: 'true'

      - name: Run performance benchmarks
        id: benchmarks
        run: npm run benchmark
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          BENCHMARK_MODE: 'true'

      - name: Post benchmark results as PR comment
        if: github.event_name == 'pull_request'
        # Posting the perf comment is a non-essential side effect — never let it
        # fail the code-health check that gates merges.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const resultsPath = './benchmarks/results.json';
            const baselinePath = './benchmarks/baseline.json';

            if (!fs.existsSync(resultsPath)) {
              console.log('No benchmark results found');
              return;
            }

            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf-8'));
            let baseline = null;

            if (fs.existsSync(baselinePath)) {
              baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf-8'));
            }

            const metrics = [
              { key: 'dashboard_load_ms', label: 'Dashboard Load', threshold: 2000 },
              { key: 'pie_chart_render_ms', label: 'Pie Chart Render', threshold: 100 },
              { key: 'line_chart_render_ms', label: 'Line Chart Render', threshold: 150 },
              { key: 'realtime_latency_ms', label: 'Real-time Latency', threshold: 300 },
            ];

            let tableRows = '';
            metrics.forEach(({ key, label, threshold }) => {
              const current = results[key];

              if (current === -1) {
                tableRows += `| ${label} | Not measured | N/A | N/A | ⊘ |\n`;
                return;
              }

              const status = current > threshold ? '❌' : '✅';

              if (baseline) {
                const baselineValue = baseline[key];
                const change = current - baselineValue;
                const changePercent = ((change / baselineValue) * 100).toFixed(1);
                const trend = change > 0 ? '↑' : change < 0 ? '↓' : '→';
                tableRows += `| ${label} | ${current}ms | ${baselineValue}ms | ${trend} ${changePercent}% | ${status} |\n`;
              } else {
                tableRows += `| ${label} | ${current}ms | N/A | N/A | ${status} |\n`;
              }
            });

            const comment = \`## 📊 Performance Benchmark Results

            | Metric | Current | Baseline | Change | Status |
            |--------|---------|----------|--------|--------|
            \${tableRows}

            **Thresholds:**
            - Dashboard Load: <2000ms
            - Pie Chart Render: <100ms
            - Line Chart Render: <150ms
            - Real-time Latency: <300ms

            \${results.dashboard_load_ms > 2000 || results.realtime_latency_ms > 300 ? '⚠️ **Performance regression detected!**' : '✅ All performance targets met'}
            \`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Deploy Vercel preview and post URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            try {
              execSync('npm install --global vercel@latest', { stdio: 'inherit' });
              execSync('vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}', { stdio: 'inherit' });
              execSync('vercel build --token=${{ secrets.VERCEL_TOKEN }}', { stdio: 'inherit' });
              const previewUrl = execSync(
                'vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}',
                { encoding: 'utf8' }
              ).trim();

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🚀 Vercel Preview Deployment\n\nPreview URL: ${previewUrl}\n\nThis preview will be updated on each push to this PR.`
              });
            } catch (err) {
              console.log('Preview deployment skipped (Vercel secrets may not be configured):', err.message);
            }

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Sensitive Vercel env vars pull as EMPTY strings (vercel pull omits their
      # values), so this step gets them from GitHub Secrets.
      #
      # NEXT_PUBLIC_SUPABASE_URL is here and is LOAD-BEARING: `next lint`, which
      # this step runs, loads next.config.ts, and that config throws when the
      # variable is unset. Verified by hiding it — `next lint` fails on the
      # throw, `tsc --noEmit` does not.
      #
      # Its two former companions (_ANON_KEY, NEXT_PUBLIC_APP_URL) were removed.
      # They were added in hp-13 so the gate's `next build` would match
      # production's, and #46 removed that build, which made them cargo the same
      # day. Verified rather than assumed: with each hidden in turn, nothing in
      # this step notices — check-env-vars.js reads
      # .vercel/.env.production.local (scripts/check-env-vars.js:60), so it still
      # reports 14/14, and next.config.ts reads only the URL.
      #
      # HISTORY, so the probe line below is not mistaken for decoration: the
      # CHECKER reads the pulled file, but `next build` ran as a CHILD PROCESS
      # inheriting only this `env:` block, and Next.js never reads that file. So
      # "All 14 required variables present" was true of the check and false of
      # the build it spawned — the gate's green was NARROWER THAN IT LOOKED. The
      # #42 probe measured it at 0. That build is gone now; the probe stays
      # because it is the cheapest way to see the divergence return.
      - name: Run pre-deployment checks
        env:
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        # One line, kept: it is the only thing that would show this divergence
        # returning. Expected value now 1 — only NEXT_PUBLIC_SUPABASE_URL is
        # passed. It read 0 before hp-13, 2 while _ANON_KEY was also set, and 1
        # from here.
        #
        # The number has been wrong in a comment twice, so state the rule rather
        # than the answer: the pattern is `NEXT_PUBLIC_SUPABASE`, so it counts
        # only variables whose NAME contains that substring. NEXT_PUBLIC_APP_URL
        # never matched it and was never counted, whatever the env block says.
        #
        # --skip-build: the build is deliberately NOT run here. See the commit
        # that added this flag — in short, `deploy` has `needs: test`, and the
        # test job already builds this same commit, so a compile error never
        # reaches this step. Everything else the gate checks (env, types, lint,
        # tests) is not duplicated anywhere and stays.
        run: |
          echo "NEXT_PUBLIC_SUPABASE var count: $(env | grep -c NEXT_PUBLIC_SUPABASE || true)"
          node scripts/pre-deployment-check.js --skip-build

      - name: Build Project Artifacts
        env:
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # NOTE — GitHub's Deployments API is EMPTY for these, by design. Deploying
      # with the Vercel CLI does not create GitHub deployment records; the last
      # ones in that API are from Dec 2025, when the Git integration was still
      # doing the deploying. So `gh api repos/:owner/:repo/deployments` is not a
      # way to confirm what shipped, and its silence is not evidence of failure.
      # To verify a deployed commit, read it from Vercel (dashboard or MCP), or
      # fall back to this job's own success plus a live health check.
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
