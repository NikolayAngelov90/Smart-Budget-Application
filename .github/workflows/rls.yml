name: RLS Integration Tests

# Real-database Row-Level-Security tests (Story 13.1 / Epic 12 retro PREP-1).
# Boots a local Supabase stack, applies migrations, then runs the env-gated
# *.rls.test.ts suites. Separate from the main Tests workflow so a Supabase/Docker
# hiccup never blocks the unit/integration suite. Tests verify NFR10/NFR11
# (household isolation per transparency level) against actual RLS policies.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  # Dispatchable so the isolation guarantees can be MUTATION-TESTED on a branch
  # without opening a pull request for each mutation. The standing rule is that a
  # guard with no recorded red state is not evidence, and for RLS the only honest
  # red state is a real policy deliberately broken against a real Postgres — which
  # needs a way to run this suite on an arbitrary ref.
  workflow_dispatch:

jobs:
  rls:
    name: RLS Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # THE SHARED STACK DEFINITION. Everything about raising the local stack —
      # the pinned CLI, the authenticated pull, the start, the exported
      # credentials — lives in .github/actions/local-supabase/action.yml and
      # nowhere else. Three times a fix landed in one of these two workflows and
      # not the other; the extraction makes that impossible rather than
      # discouraged. Read that file for the pin's rationale.
      - name: Local Supabase stack (shared definition)
        id: stack
        uses: ./.github/actions/local-supabase
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Printed so the sharing is OBSERVABLE, not merely structural. Two
      # workflows that import the same action but read a stale copy would pass
      # every structural inspection; this is the value to compare between them.
      - name: Report the shared stack definition this job used
        run: 'echo "shared-action CLI pin = ${{ steps.stack.outputs.cli-version }}"'

      # ONE IMPLEMENTATION, TWO CALL SITES. This step used to carry its own copy of
      # the credentials check. It now runs the SAME script that `npm run test:rls`
      # runs, so there is nothing here that can drift from it. The step is kept
      # only to give the failure a named position in the job instead of burying it
      # in jest's output — it is not a second guard.
      #
      # Removing the copy also removed a trap: the copy ran FIRST and checked less
      # (three names, none of them reported, and no host check at all), so its
      # weaker message is the one anybody would ever have read.
      - name: RLS preflight (the same script npm run test:rls runs)
        run: node scripts/rls-preflight.mjs

      - name: Run RLS integration tests
        run: npm run test:rls

      - name: Stop Supabase
        if: always()
        run: supabase stop
