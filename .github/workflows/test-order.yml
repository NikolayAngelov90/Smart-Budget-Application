name: Test Order

# ===========================================================================
# ONE PINNED ORDER, CHECKED ON EVERY PR.
# ===========================================================================
# Jest runs tests in declaration order by default, and `npm run test:coverage`
# in test.yml does exactly that. Declaration order is not special - it is one
# order out of many - and seven suites were found during October 2026 that
# passed in it and failed in others. This job runs the suite in a DIFFERENT
# order, pinned so it is the same different order every time.
#
# WHY A PINNED SEED AND NOT A RANDOM ONE. A random seed makes this gate
# non-deterministic by construction: it goes red on work that did not cause it,
# the author cannot reproduce it, and the check gets switched off. That is the
# same argument schema-drift.yml makes for not running on pull requests, and it
# is the failure mode to design against first. A pinned seed catches a
# REGRESSION against this order, deterministically - and a red PR is seen by its
# author by construction, so this arm needs no notification.
#
# WHAT IT DOES NOT CATCH, stated rather than left implied: an order dependency
# that only manifests in some OTHER order. Finding those needs a random seed,
# and a random seed needs somewhere for its failures to be heard.
#
# >>> DO NOT ADD A `schedule:` TRIGGER TO THIS FILE WITHOUT A NOTIFICATION. <<<
# The schema-drift check failed on 21 consecutive nights (8-28 October 2026) and
# nobody saw a single one of them, because a red X on a scheduled workflow is an
# alarm with nobody contracted to hear it. The nightly random-seed arm belongs
# here only once that mechanism exists. See docs/schema-drift-check.md.
#
# THE SEED: 20261029, the date it was pinned. It is not magic and it is not
# special - it is one order, held still. Chosen after the full suite was
# verified green across seeds 1-20 (20 of 20 runs) and then three times at this
# seed specifically, 2711 passed / 0 failed each time.
#
# ONE SHELL NOTE, because the first draft of this file had it wrong: an
# `::error::` message with backticks inside DOUBLE quotes is command
# substitution, so the error path would have run the very suite it was reporting
# on. Single quotes, or no backticks, in every message below.
#
# THE PRECONDITION THAT HAD TO BE MET FIRST, because it is why this job did not
# ship a week earlier: a pinned seed buys a deterministic ORDER, not a
# deterministic OUTCOME. While `TransactionEntryModal.composer` was failing
# about one full-suite run in five AT A FIXED SEED, this gate would have gone
# red roughly 20% of the time for no reason. That was a re-fetch loop created by
# an unfaithful mock, fixed in #90. Do not re-pin this seed, and do not add a
# randomized arm, while any suite fails intermittently at a fixed seed - fix
# that first, or the gate teaches people to ignore it.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-order:
    name: Pinned test order (seed 20261029)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ANTI-VACUITY, AND IT IS NOT DECORATION. If --randomize or --seed were
      # ever dropped from the npm script - a merge resolution, a typo, a
      # well-meaning edit - this job would run the suite in DECLARATION ORDER,
      # pass, and report a green check that measures nothing. That is the exact
      # class this repo keeps finding: a gate whose green means something
      # narrower than it looks.
      #
      # --showConfig resolves the SAME npm script and prints the effective
      # config WITHOUT running a single test, so both flags are asserted from
      # the one definition in package.json rather than restated here.
      - name: Verify the order is actually randomized and actually pinned
        run: |
          npm run test:order -- --showConfig > jest-config.json 2>&1

          RANDOMIZE=$(grep -oE '"randomize": *(true|false)' jest-config.json | head -1 | grep -oE 'true|false')
          SEED=$(grep -oE '"seed": *-?[0-9]+' jest-config.json | head -1 | grep -oE '\-?[0-9]+')

          echo "resolved randomize = ${RANDOMIZE:-ABSENT}"
          echo "resolved seed      = ${SEED:-ABSENT}"

          if [ "$RANDOMIZE" != "true" ]; then
            echo "::error::npm run test:order resolves randomize=${RANDOMIZE:-ABSENT}. Without it this job runs the suite in declaration order and its green means nothing. Restore --randomize in package.json."
            exit 1
          fi
          if [ "$SEED" != "20261029" ]; then
            echo "::error::npm run test:order resolves seed=${SEED:-ABSENT}, expected 20261029. A pinned gate whose seed moves is not pinned. If the seed is being changed deliberately, change the expected value in this workflow too, and say why in the commit."
            exit 1
          fi
          echo "ok: randomized, and pinned to 20261029"

      # The run itself, plus a SECOND and INDEPENDENT confirmation: the step
      # above asserts the RESOLVED CONFIG, this one asserts what the RUN
      # ACTUALLY REPORTED. Jest prints a `Seed:` line whenever a seed is in
      # effect, in CI as well as a terminal.
      #
      # NOTE ON A FLAG THAT IS NOT HERE: this script carried `--showSeed` for
      # about an hour. Mutation-testing it showed the `Seed:` line prints
      # without it under CI=true, so dropping the flag changed nothing and no
      # mutation could redden it. By this repo's own rule - if no mutation
      # reddens it, it is not a guard yet, so give it a test that can fail or
      # take it out - it was taken out. Leaving it would have implied the check
      # depends on it, which is worse than useless: it is misleading.
      #
      # The guard below IS load-bearing, verified by the mutations that redden
      # it: seed changed to 1 -> `Seed: 1`, red; `--seed` dropped entirely ->
      # a random seed each run, red.
      - name: Run the suite in the pinned order
        run: set -o pipefail && npm run test:order 2>&1 | tee jest-run.log

      - name: Confirm the run reported the pinned seed
        if: always()
        run: |
          if ! grep -qE '^Seed: +20261029$' jest-run.log; then
            echo "::error::The run did not report Seed: 20261029 - so the suite did not run in the pinned order, whatever the config said. What it printed instead:"
            grep -iE '^Seed:' jest-run.log || echo "  (no Seed line at all)"
            exit 1
          fi
          echo "ok: the suite ran in order 20261029"

      # THE THIRD CHECK, and the one the other two cannot make. --showConfig
      # asserts what RESOLVED; the Seed line asserts what the run REPORTED.
      # Neither asserts THAT TESTS RAN.
      #
      # A jest invocation matching nothing EXITS 0. Measured, not assumed:
      #
      #   `-t` with a pattern that matches no test name
      #       exit 0,  "Tests: 2776 skipped, 2776 total"  - and NO passed count
      #   a path pattern matching one file
      #       exit 0,  "Tests: 24 passed, 24 total"       - 24 of 2711
      #   a path pattern matching nothing
      #       exit 1 - this one jest already protects
      #
      # The first is the `jest -t` class this repo has already been bitten by: a
      # run that matches nothing is green and silent. The second is the shape of
      # an over-narrow config or testPathIgnorePatterns. Both pass every check
      # above.
      #
      # THE FLOOR IS DELIBERATELY LOW. 2000 against a current 2711, and the
      # reason is what the TGRANT floor taught: a tight floor needs maintenance
      # every time the count legitimately moves, goes stale upward, and
      # eventually fires on a legitimate change - which is exactly how the drift
      # check spent 21 days red. A low floor catches catastrophe, never needs
      # touching, and makes no claim to catch small regressions. Coverage is
      # codecov's job; this is a canary.
      # TWO DISTINCT REDS, and the distinction is the point. "The summary could
      # not be parsed" is not the same claim as "zero tests passed", and a
      # parser that defaults to zero on a parse failure conflates them: both
      # trip the floor today and they diverge the first time jest changes its
      # summary format, at which point the floor silently becomes a format
      # check that always fails - or worse, always passes.
      #
      # This is the same distinction this repo already draws for its mutation
      # harness, where NOT MEASURED is deliberately kept separate from "nothing
      # went red". It was missing here on the first attempt.
      #
      # The parse ANCHOR is the `total` count, not the `passed` count. Jest
      # OMITS the passed clause when it is zero - `Tests: 2776 skipped, 2776
      # total` is a well-formed summary meaning zero passed - but it always
      # prints a total. So:
      #
      #   no `Tests:` line, or no `N total` in it  ->  NOT MEASURED, its own red
      #   `N total` present, `N passed` absent     ->  genuinely zero passed
      #   `N passed` present                       ->  that number, floored
      - name: Floor on the number of tests that actually ran
        if: always()
        run: |
          TALLY=$(grep -E '^Tests:' jest-run.log | tail -1)

          if [ -z "$TALLY" ]; then
            echo '::error::NOT MEASURED - no `Tests:` summary line in the run output at all. The floor cannot be evaluated, which is not the same as a floor of zero. Last 20 lines of the log:'
            tail -20 jest-run.log
            exit 1
          fi

          TOTAL=$(printf '%s' "$TALLY" | grep -oE '[0-9]+ total' | grep -oE '[0-9]+')
          if [ -z "$TOTAL" ]; then
            echo "tally : $TALLY"
            echo '::error::NOT MEASURED - the `Tests:` line carries no `N total`, so jest has changed its summary format and this parser no longer reads it. Fix the parser; do NOT lower the floor.'
            exit 1
          fi

          # Only now is absence of a passed count meaningful: jest omits that
          # clause at zero, and the well-formed total above proves the line was
          # read rather than guessed.
          PASSED=$(printf '%s' "$TALLY" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
          PASSED=${PASSED:-0}

          echo "tally : $TALLY"
          echo "parsed: $PASSED passed of $TOTAL total  (floor 2000)"

          if [ "$PASSED" -lt 2000 ]; then
            echo '::error::Only '"$PASSED"' tests passed, against a floor of 2000. This is NOT a pass: a jest run that matches nothing exits 0 and reports no passed count, so a green check here would mean the suite never ran. Check for a stray -t, a narrowed testMatch, or a testPathIgnorePatterns change.'
            exit 1
          fi
          echo "ok: $PASSED tests ran"
