name: Schema Drift

# Compares PRODUCTION's catalog against the catalog supabase/migrations/ produces.
# Nothing compared these two before, which is how both vulnerabilities found on
# 2026-09-24 stayed invisible — one for six months. See
# scripts/schema-drift/compare.mjs for the full reasoning.
#
# ===========================================================================
# WHY THIS DOES NOT RUN ON PULL REQUESTS
# ===========================================================================
# Two reasons, and the second is the decisive one.
#
# 1. A PR author has not caused production drift and cannot fix it. Blocking them
#    on it creates exactly the pressure that gets a check disabled.
#
# 2. CREDENTIAL EXPOSURE. This workflow holds a production database credential.
#    For a same-repo branch, `pull_request` runs the workflow definition FROM THE
#    BRANCH — so a branch could edit this file to print the secret, and any PR
#    would be a credential exfiltration path. Restricting to `push: main`,
#    `schedule` and `workflow_dispatch` means the definition that runs is one that
#    has already been reviewed and merged.
#
# The cost is that a migration PR does not show its own pending state until after
# merge. That is acceptable: pending state is a statement about production versus
# main, which is where it becomes actionable anyway.
#
# ===========================================================================
# THE CREDENTIAL
# ===========================================================================
# `schema_reader` is a purpose-built Postgres role:
#   LOGIN, NOSUPERUSER, NOCREATEDB, NOCREATEROLE, NOBYPASSRLS, NOINHERIT,
#   zero role memberships, zero table grants.
# It reads pg_catalog (which carries PUBLIC SELECT) and CANNOT read a single row
# of user data — verified over a real authenticated connection: 78 policies, 26
# tables, 350 columns, 26 functions and 22 triggers readable; `transactions` and
# `user_profiles` both 42501.
#
# It is deliberately NOT the service-role key and NOT `supabase_read_only_user`.
# That second one looks like the right answer and is not: it is a member of
# pg_read_all_data with BYPASSRLS, so it reads every row in the database.
#
# HOST: aws-1, NOT aws-0. Verified by probe on 2026-09-24 — aws-0 rejects this
# project's role with `XX000 tenant/user not found`, which reads as a credentials
# problem and is not one. The pooler cluster is project-specific and MUST NOT be
# constructed from the region or copied from documentation. Do not "fix" this to
# aws-0.
#
# Direct (db.<ref>.supabase.co) is deliberately unused: it is IPv6-ONLY, and
# GitHub runners are IPv4-only, so it can never work here whatever the role.
#
# Session mode on 5432 rather than transaction mode on 6543. Both authenticate;
# session mode has no prepared-statement or transaction-scope caveats and the
# check is a handful of catalog SELECTs where pooling efficiency is irrelevant.

on:
  schedule:
    # 06:00 UTC daily — after the 02:00 cron window, so a schema change made by a
    # scheduled job is visible on the same day's run.
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: schema-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Production vs migrations
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is LOAD-BEARING, not hygiene. The pending-age gate asks how
      # old the newest migration FILE is, via `git log -1 --format=%ct -- <file>`.
      # Under the default depth-1 checkout git has exactly one commit to attribute
      # every file to, so that returns the TIP commit's timestamp for all of them.
      # Measured 2026-10-03: CI reported 1790259206 as "the newest migration
      # file's commit epoch", which is commit 1479853 (#66, a push-service fix
      # that touched no migration at all). The newest migration on main is from
      # 2026-09-17. The gate had been measuring the age of the last commit to
      # main, and reading 5.9 days where the truth was 13.3.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # The CLI ships the local Postgres image, so `latest` means the LOCAL
      # Postgres MINOR version floats with whichever CLI released most recently.
      # On 2026-10-01 it moved 17.6 -> 17.11 while production stayed on 17.6, and
      # this check then failed three days running without comparing a single
      # catalog object — the assertion sat before the work.
      #
      # Pinned to the SAME version as .github/workflows/rls.yml, deliberately:
      # this check's entire claim is that it compares the stack the RLS suite
      # validates against with the stack serving users. Two different local
      # Postgres versions would make that claim false, and nothing would surface
      # it — the comparison would still run and still look authoritative.
      #
      # THE PIN IS A MAINTAINED VALUE, NOT A FROZEN ONE. When production's minor
      # moves, the comparator reports it (red, with both versions named), and
      # bumping this pin — HERE AND IN rls.yml TOGETHER — is the deliberate
      # response. Leaving it behind is a decision too, and it is the one that
      # makes the RLS suite test something production is not.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      # Docker Hub's anonymous pull limit is per IP, and GitHub's runner IPs are
      # shared, so `supabase start` hits `toomanyrequests` while pulling the stack
      # and retries: 18 occurrences on 2026-10-01, 19 on 10-02, 16 on 10-03. The
      # stack came up every time. A limit survived three times will eventually not
      # be, and that failure will read as an infrastructure flake — which is how
      # it gets re-run instead of fixed.
      #
      # Authenticating moves the limit from per-IP-anonymous to per-account, which
      # is the actual remedy. It needs a Docker Hub account and a read-only access
      # token, so this step is INERT until those two secrets exist. It says so
      # when inert rather than passing quietly, because an unmitigated state that
      # looks identical to a mitigated one is the exact shape of defect this
      # repository keeps finding. See docs/schema-drift-check.md for why the two
      # credential-free alternatives were not taken.
      - name: Authenticate Docker Hub pulls (inert until the secrets exist)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            echo "Docker Hub: AUTHENTICATED - the pull limit is now per-account."
          else
            echo "Docker Hub: ANONYMOUS - the pull limit is per-IP and GitHub's runner IPs are shared."
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (read-only token) to raise it."
            echo "::warning::Docker Hub pulls are anonymous; the rate limit is unmitigated. See docs/schema-drift-check.md"
          fi

      # The output is captured so the rate limit can be NAMED when it bites.
      # Without this the step fails with a pull error buried in stack startup
      # noise, which looks like a flake and gets re-run.
      - name: Start Supabase (applies supabase/migrations/*)
        run: |
          set -o pipefail
          if ! supabase start 2>&1 | tee /tmp/supabase-start.log; then
            if grep -q 'toomanyrequests' /tmp/supabase-start.log; then
              echo "::error::Docker Hub rate limit (toomanyrequests) stopped the local stack coming up. This is NOT a flake and re-running will not fix it: the anonymous pull limit is per-IP and GitHub's runners share IPs. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (read-only) to move the limit to per-account."
            fi
            exit 1
          fi
          HITS=$(grep -c 'toomanyrequests' /tmp/supabase-start.log || true)
          if [ "$HITS" -gt 0 ]; then
            # Visible on a green run too, so the trend is readable rather than
            # discovered on the day it stops being survivable.
            echo "Docker Hub rate limit was hit ${HITS}x during the pull; the stack came up anyway."
          fi

      - name: Resolve local DB URL
        run: |
          echo "LOCAL_DB_URL=$(supabase status -o env | grep '^DB_URL' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Verify local DB URL resolved (fail loud — never dump nothing)
        run: |
          if [ -z "$LOCAL_DB_URL" ]; then
            echo "::error::LOCAL_DB_URL is empty — the migration-side dump would be silently empty and the comparison meaningless."
            exit 1
          fi
          echo "LOCAL_DB_URL resolved (value not printed)"

      - name: Dump the migration-built catalog
        run: |
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/schema-drift/dump-catalog.sql > migrations.tsv
          echo "migration-side records: $(wc -l < migrations.tsv)"

      - name: Dump production's catalog
        env:
          # The ONLY use of this secret. Never echoed, never interpolated into a
          # connection string that could appear in an error.
          PGPASSWORD: ${{ secrets.SCHEMA_READER_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::SCHEMA_READER_PASSWORD is not set — production's catalog would be unreadable and the check would compare against nothing."
            exit 1
          fi
          psql \
            --host=aws-1-eu-north-1.pooler.supabase.com \
            --port=5432 \
            --username=schema_reader.rlcgqvqpuqkkxtczalpi \
            --dbname=postgres \
            --set=sslmode=require \
            -v ON_ERROR_STOP=1 \
            -f scripts/schema-drift/dump-catalog.sql > production.tsv
          echo "production-side records: $(wc -l < production.tsv)"

      - name: Newest migration file's commit time (for the pending age gate)
        run: |
          # Pending objects are routine; pending and FORGOTTEN is a finding. A
          # catalog object cannot be traced back to the migration that defines it,
          # so the gate uses the NEWEST migration file's commit time: if the most
          # recent migration is over a week old and production still lacks objects
          # the migrations define, that is not a deploy in flight.
          #
          # The precondition is asserted rather than assumed. A shallow clone does
          # not fail this loop, it answers it WRONGLY — every file resolves to the
          # tip commit — and the answer stays plausible, which is why it went
          # unnoticed from the day this check shipped until 2026-10-03.
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::The checkout is SHALLOW. 'git log -1 -- <file>' then returns the tip commit for every file, so this gate would measure the age of the last commit to main instead of the newest migration. Set fetch-depth: 0 on actions/checkout."
            exit 1
          fi
          NEWEST=0
          NEWEST_FILE=""
          for f in supabase/migrations/*.sql; do
            T=$(git log -1 --format=%ct -- "$f" || echo 0)
            if [ -n "$T" ] && [ "$T" -gt "$NEWEST" ]; then
              NEWEST=$T
              NEWEST_FILE=$f
            fi
          done
          echo "NEWEST_MIGRATION_EPOCH=$NEWEST" >> "$GITHUB_ENV"
          # The FILE is named, not only the epoch. An epoch alone is unreadable,
          # and an unreadable number is one nobody checks against reality.
          echo "newest migration: $NEWEST_FILE"
          echo "  committed: $NEWEST ($(date -u -d "@$NEWEST" '+%Y-%m-%dT%H:%M:%SZ'))"

      - name: Compare
        run: node scripts/schema-drift/compare.mjs production.tsv migrations.tsv "$NEWEST_MIGRATION_EPOCH"

      - name: Upload both catalogs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-catalogs
          # Catalog metadata only — object names, types, policy predicates,
          # grants. No user data: the role that produced production.tsv cannot
          # read any.
          path: |
            production.tsv
            migrations.tsv
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop
